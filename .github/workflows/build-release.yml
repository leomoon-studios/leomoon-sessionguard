name: Build Windows packages

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: Test build version in X.Y.Z form
        required: true
        default: '1.3.6'
        type: string

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check release tag and source
    runs-on: windows-2022
    timeout-minutes: 15
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate version
        id: metadata
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.ref_name }}
          BUILD_VERSION: ${{ inputs.version }}
        run: |
          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            if ($env:BUILD_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw 'Manual version must use X.Y.Z.' }
            $version = $env:BUILD_VERSION
          } elseif ($env:RELEASE_TAG -cmatch '^v(\d+\.\d+\.\d+)$') {
            $version = $Matches[1]
          } else {
            throw 'Release tag must use vX.Y.Z.'
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Install checksum-pinned tools
        id: tools
        shell: pwsh
        run: '& scripts/install-build-tools.ps1 -ToolsDirectory "$env:RUNNER_TEMP\sessionguard-tools"'
      - name: Run strict checks and tests
        shell: pwsh
        env:
          AUTOIT_DIRECTORY: ${{ steps.tools.outputs.autoit_directory }}
        run: '& scripts/check.ps1 -ToolchainDirectory $env:AUTOIT_DIRECTORY'

  build:
    name: Build and verify Windows packages
    needs: check
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install checksum-pinned tools
        id: tools
        shell: pwsh
        run: '& scripts/install-build-tools.ps1 -ToolsDirectory "$env:RUNNER_TEMP\sessionguard-tools" -IncludeInno'
      - name: Build x86 application
        id: application
        shell: pwsh
        env:
          BUILD_VERSION: ${{ needs.check.outputs.version }}
          AUTOIT_DIRECTORY: ${{ steps.tools.outputs.autoit_directory }}
          WRAPPER_PATH: ${{ steps.tools.outputs.autoit3wrapper_path }}
        run: '& scripts/build-windows.ps1 -Version $env:BUILD_VERSION -AutoItDirectory $env:AUTOIT_DIRECTORY -AutoIt3WrapperPath $env:WRAPPER_PATH'
      - name: Test unsigned and incomplete signing configurations
        shell: pwsh
        env:
          BUILD_VERSION: ${{ needs.check.outputs.version }}
          STAGE_DIRECTORY: ${{ steps.application.outputs.output_directory }}
          ISCC_PATH: ${{ steps.tools.outputs.iscc_path }}
        run: '& tests/SigningSmoke.ps1 -Version $env:BUILD_VERSION -StageDirectory $env:STAGE_DIRECTORY -IsccPath $env:ISCC_PATH'
      - name: Package and verify
        shell: pwsh
        env:
          BUILD_VERSION: ${{ needs.check.outputs.version }}
          STAGE_DIRECTORY: ${{ steps.application.outputs.output_directory }}
          ISCC_PATH: ${{ steps.tools.outputs.iscc_path }}
          COMMIT_SHA: ${{ github.sha }}
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: '& scripts/package-windows.ps1 -Version $env:BUILD_VERSION -StageDirectory $env:STAGE_DIRECTORY -DistDirectory dist -IsccPath $env:ISCC_PATH -Commit $env:COMMIT_SHA'
      - name: Upload verified Windows packages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: sessionguard-${{ needs.check.outputs.version }}-windows-x86-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish tagged release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [check, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified packages
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: sessionguard-${{ needs.check.outputs.version }}-windows-x86-${{ github.sha }}
          path: dist
      - name: Verify and publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          TARGET_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c SHA256SUMS)
          gh api "repos/$GH_REPO/releases/generate-notes" -f tag_name="$RELEASE_TAG" -f target_commitish="$TARGET_COMMIT" --jq .body > release-notes.md
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --notes-file release-notes.md
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --title "$RELEASE_TAG" --notes-file release-notes.md
          fi
